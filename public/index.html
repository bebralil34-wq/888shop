<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8ATE STUDIO | RESALE CLOTHING</title>
    <style>
        :root {
            --bg: #000;
            --surface: #111;
            --text: #fff;
            --gray: #666;
            --accent: #fff;
            --border: #222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); }
        
        header { padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: 900; }
        
        .categories { display: flex; gap: 1.5rem; overflow-x: auto; padding: 1rem 2rem; border-bottom: 1px solid var(--border); }
        .cat-link { color: var(--gray); font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap; text-transform: uppercase; }
        .cat-link.active { color: #fff; }

        main { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        
        .card { background: var(--surface); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; }
        .card img { width: 100%; aspect-ratio: 1; object-fit: cover; }
        .card-info { padding: 1rem; }
        .card-brand { font-size: 0.7rem; color: var(--gray); font-weight: 800; }
        .card-title { font-weight: 600; margin: 0.2rem 0; }
        
        /* Sidebar Cart & Checkout */
        .sidebar { position: fixed; top: 0; right: -100%; width: 100%; max-width: 500px; height: 100vh; background: var(--bg); z-index: 200; transition: 0.4s; border-left: 1px solid var(--border); padding: 2rem; display: flex; flex-direction: column; }
        .sidebar.active { right: 0; }
        
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; font-size: 0.7rem; color: var(--gray); margin-bottom: 0.5rem; font-weight: 700; }
        .input-group input, .input-group textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 1rem; color: #fff; border-radius: 4px; }
        
        .btn { background: #fff; color: #000; border: none; padding: 1.2rem; width: 100%; font-weight: 900; cursor: pointer; margin-top: 1rem; border-radius: 4px; }
        
        .status-screen { text-align: center; padding-top: 4rem; }
        .payment-card { background: #fff; color: #000; padding: 2rem; border-radius: 12px; margin-top: 2rem; font-weight: 800; }
        footer { max-width: 1400px; margin: 4rem auto 0; padding: 2rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 1rem; color: var(--gray); font-size: 0.8rem; }
        footer a { color: var(--text); text-decoration: none; font-weight: 800; }
        footer a:hover { text-decoration: underline; }
        .footer-links { display: flex; gap: 1.5rem; flex-wrap: wrap; }
        @media (max-width: 600px) { footer { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>

<header>
    <div class="logo">8ATE STUDIO</div>
    <div onclick="toggleSidebar()" style="cursor:pointer; font-weight:800; font-size:0.8rem;">BAG (<span id="cart-count">0</span>)</div>
</header>

<div class="categories" id="cat-list">
    <div class="cat-link active" onclick="loadCat('Все', this)">Все</div>
    <div class="cat-link" onclick="loadCat('Верхняя одежда', this)">Верхняя одежда</div>
    <div class="cat-link" onclick="loadCat('Худи', this)">Худи</div>
    <div class="cat-link" onclick="loadCat('Обувь', this)">Обувь</div>
    <div class="cat-link" onclick="loadCat('Аксессуары', this)">Аксессуары</div>
</div>

<main>
    <div class="grid" id="grid"></div>
</main>

<footer>
    <div>© 2026 8ATE STUDIO · RESALE CLOTHING</div>
    <div class="footer-links">
        <a href="https://t.me/Shop8883" target="_blank" rel="noopener noreferrer">Telegram</a>
        <span style="color:var(--gray);">Avito — ссылка скоро</span>
    </div>
</footer>

<div class="sidebar" id="sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
        <h2 style="font-weight:900;">CHECKOUT</h2>
        <span onclick="toggleSidebar()" style="cursor:pointer; font-size:1.5rem;">✕</span>
    </div>

    <div id="checkout-form">
        <div id="cart-preview" style="margin-bottom:2rem; font-size:0.9rem;"></div>
        
        <div class="input-group">
            <label>ФИО ПОЛУЧАТЕЛЯ</label>
            <input type="text" id="name" placeholder="Иванов Иван Иванович">
        </div>
        <div class="input-group">
            <label>НОМЕР ТЕЛЕФОНА</label>
            <input type="text" id="phone" placeholder="+7 (999) 000-00-00">
        </div>
        <div class="input-group">
            <label>OZON ДОСТАВКА (ГОРОД И АДРЕС ПВЗ)</label>
            <textarea id="ozon" rows="3" placeholder="г. Москва, ул. Пушкина 10, ПВЗ Ozon"></textarea>
        </div>
        
        <button class="btn" onclick="placeOrder()">ОФОРМИТЬ ЗАКАЗ</button>
    </div>

    <div id="status-area" style="display:none;" class="status-screen">
        <div style="font-size:3rem;">⏳</div>
        <h3 style="margin:1rem 0;">ЗАКАЗ ОТПРАВЛЕН</h3>
        <p style="color:var(--gray);">Ожидаем подтверждения от продавца. Не закрывайте эту страницу.</p>
        <div id="payment-details" style="display:none;" class="payment-card"></div>
    </div>
</div>

<script>
    let cart = [];
    let currentOrderId = null;

    async function loadCat(cat, el) {
        document.querySelectorAll('.cat-link').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        const res = await fetch(`/api/products?category=${cat}`);
        const data = await res.json();
        document.getElementById('grid').innerHTML = data.map(p => `
            <div class="card" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">
                <img src="${p.image}">
                <div class="card-info">
                    <div class="card-brand">${p.category}</div>
                    <div class="card-title">${p.name}</div>
                    <div style="font-weight:800;">${p.price} ₽</div>
                </div>
            </div>
        `).join('');
    }

    function addToCart(id, name, price) {
        cart.push({id, name, price});
        document.getElementById('cart-count').innerText = cart.length;
        document.getElementById('cart-preview').innerHTML = cart.map(i => `<div>${i.name} - ${i.price}₽</div>`).join('');
        toggleSidebar();
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }

    async function placeOrder() {
        const orderData = {
            items: cart,
            total: cart.reduce((s,x)=>s+x.price, 0),
            customerName: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            ozonInfo: document.getElementById('ozon').value
        };
        const res = await fetch('/api/order', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(orderData)
        });
        const result = await res.json();
        currentOrderId = result.orderId;
        document.getElementById('checkout-form').style.display = 'none';
        document.getElementById('status-area').style.display = 'block';
        startPolling();
    }

    function startPolling() {
        const interval = setInterval(async () => {
            const res = await fetch(`/api/order-status/${currentOrderId}`);
            const data = await res.json();
            if (data.status === 'confirmed') {
                clearInterval(interval);
                document.getElementById('status-area').innerHTML = `
                    <div style="font-size:3rem;">✅</div>
                    <h3>ЗАКАЗ ПОДТВЕРЖДЕН</h3>
                    <div class="payment-card">${data.payment}</div>
                `;
            }
        }, 3000);
    }

    loadCat('Все', document.querySelector('.cat-link'));
</script>
</body>
</html>
